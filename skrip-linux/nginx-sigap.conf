# nginx untuk SIGAP — mengakhiri TLS lalu meneruskan ke Node.
#
# Pasang:
#   sudo cp skrip-linux/nginx-sigap.conf /etc/nginx/sites-available/sigap
#   sudo ln -s /etc/nginx/sites-available/sigap /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sertifikat diurus certbot, yang menulis sendiri baris ssl_* di bawah:
#   sudo certbot --nginx -d sigap.contoh.id
#
# Ganti sigap.contoh.id dengan nama domain yang sebenarnya.

# ── Pembatas laju lapis luar ──────────────────────────────────────────
# Aplikasi sudah punya pembatas lajunya sendiri, dan itu yang lebih paham
# konteks — ia menghitung per pasangan akun+alamat pada halaman masuk.
# Yang ini lapis kasar di depannya, untuk menahan banjir permintaan sebelum
# sempat menyentuh Node sama sekali.
limit_req_zone $binary_remote_addr zone=sigap_umum:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sigap_masuk:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name sigap.contoh.id;

    # Satu-satunya yang boleh dilayani lewat HTTP adalah pemeriksaan certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sigap.contoh.id;

    # Baris ssl_certificate dan ssl_certificate_key ditulis certbot di sini.

    # Badan permintaan terbesar yang mungkin adalah pengiriman keluhan; aplikasi
    # sendiri membatasi JSON pada 1 MB. Diberi kelonggaran sedikit supaya yang
    # menolak adalah aplikasi — dengan pesan yang dapat dibaca pengguna —
    # bukan nginx dengan galat 413 yang membingungkan.
    client_max_body_size 2m;

    # CATATAN PENTING — jangan menambahkan header keamanan di sini.
    # Content-Security-Policy, X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy, dan Strict-Transport-Security
    # SUDAH dipasang aplikasi di server/services/headerKeamanan.js.
    # Memasangnya dua kali membuat sebagian peramban menerima nilai ganda
    # dan menolak keduanya. Bila perlu diubah, ubah di berkas itu.
    #
    # Aplikasi hanya memasang HSTS bila COOKIE_SECURE=1 di .env — dan pada
    # penempatan ini variabel itu memang wajib diisi 1.

    access_log /var/log/nginx/sigap-akses.log;
    error_log  /var/log/nginx/sigap-galat.log;

    location / {
        limit_req zone=sigap_umum burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # WAJIB. TRUST_PROXY=1 di .env membuat aplikasi membaca header ini
        # sebagai alamat pengunjung. Tanpa keduanya, seluruh permintaan
        # tampak berasal dari 127.0.0.1 — dan pembatas laju halaman masuk
        # akan mengunci SEMUA orang begitu satu orang salah kata sandi.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Halaman masuk dibatasi lebih ketat — di sinilah percobaan menebak kata
    # sandi akan datang bila alamat ini diketahui orang luar.
    location = /api/auth/masuk {
        limit_req zone=sigap_masuk burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
