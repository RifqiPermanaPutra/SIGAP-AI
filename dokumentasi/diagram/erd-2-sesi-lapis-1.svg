<text x="56" y="582" text-anchor="start" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6878">nomor_tiket bersifat UNIQUE dan menjadi kunci alternatif; nomor inilah yang disebut pelapor saat menghubungi engineer.</text>
<text x="56" y="602" text-anchor="start" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6878">tanggal_wib disimpan terpisah dari dibuat_pada agar pengelompokan harian tidak meleset pada laporan dini hari.</text>
