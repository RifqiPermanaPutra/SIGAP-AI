<polygon points="1600,758 1587,751.5 1587,764.5" fill="#006cb8"/>
<rect x="760" y="832" width="1075" height="52" rx="26" fill="#ffffff" stroke="#006cb8" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="1297" y="863" text-anchor="middle" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="500" fill="#006cb8">Seluruh langkah tercatat dalam basis data — bernomor tiket dan dapat ditelusuri</text>
<line x1="1402" y1="556" x2="1402" y2="832" stroke="#006cb8" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="1717" y1="792" x2="1717" y2="832" stroke="#006cb8" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="60" y1="956" x2="1940" y2="956" stroke="#dde4ed" stroke-width="1"/>
<text x="60" y="990" text-anchor="start" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6878">Perubahan pokoknya bukan penggantian WhatsApp dengan situs web, melainkan berpindahnya titik pencocokan ke dalam sistem</text>
<text x="60" y="1010" text-anchor="start" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6878">sehingga alur dapat bercabang, dan setiap laporan meninggalkan catatan bernomor yang dapat ditelusuri kembali.</text>
