<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1060" width="2000" height="1060" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif">
<rect width="2000" height="1060" fill="#ffffff"/>
