<text x="88" y="472" text-anchor="start" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#006cb8">SESUDAH SIGAP</text>
<text x="88" y="492" text-anchor="start" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6878">Pencocokan dikerjakan sistem, lalu alur bercabang menurut hasilnya.</text>
