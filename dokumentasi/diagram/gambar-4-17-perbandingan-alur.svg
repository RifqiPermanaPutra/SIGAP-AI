<text x="88" y="152" text-anchor="start" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#5b6878">SEBELUM SIGAP</text>
<text x="88" y="172" text-anchor="start" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6878">Pencocokan keluhan terjadi di kepala pihak IT — tidak ada percabangan, tidak ada catatan.</text>
